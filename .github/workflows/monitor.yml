name: monitor
# External monitor for pauli.xyz. Probes run here, on GitHub's runners
# outside Pauli's production infrastructure, every 10 minutes (GitHub may
# stretch scheduled runs under load; the page states the cadence honestly).
# Results are committed to the `data` branch: raw.githubusercontent.com
# serves them to the status page with CORS, and pushes there do not trigger
# a Pages rebuild (only main is published).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: state
      - name: Probe monitors
        run: ./scripts/probe.sh state
      - name: Alert on transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/alert.sh state
      - name: Push state
        run: |
          cd state
          git config user.name "pauli-status-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "monitor: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
